# עדכוני תלויות אוטומטיים (27.9, סקירת OWASP — A03 שרשרת אספקה).
# פעם בשבוע: Pull Request לחבילות npm עם עדכון אבטחה או גרסה חדשה,
# מקובצים ל-PR אחד כדי לא להציף. ה-CI (ci.yml) רץ על כל PR כזה.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "08:00"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 3
    # רק עדכונים קטנים (minor/patch) ב-PR המקובץ. קפיצת גרסה ראשית (TypeScript
    # 5->6, vitest 3->4 וכו') שוברת את הבנייה ודורשת עבודה ייעודית — 27.9:
    # ה-PR הראשון של Dependabot נכשל בדיוק על זה. עדכוני אבטחה מגיעים בכל
    # מקרה בנפרד (GitHub security updates), גם אם הם גרסה ראשית.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      all-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
