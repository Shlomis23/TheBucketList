# בדיקה אוטומטית בכל דחיפה ל-GitHub: טיפוסים, lint ובדיקות יחידה.
# נכשל = X אדום ליד ה-commit ב-GitHub (Vercel עדיין בונה בנפרד).
# לא צריך סודות: הבדיקות לא נוגעות ב-Supabase/Vercel/Google.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
