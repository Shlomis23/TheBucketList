<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17122b" media="(prefers-color-scheme: dark)">
<title>אין חיבור · The Bucket List</title>
<!-- דף סטטי שנשמר ע"י sw.js. בכוונה בלי שום תוכן זוגי ובלי תלות בקבצים חיצוניים. -->
<style>
  :root { --bg:#faf8ff; --card:#fff; --text:#241b3a; --muted:#837a97; --primary:#5b3e9e; --soft:#efe9fb; --border:#e6e0f2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17122b; --card:#1f1a38; --text:#f1ecff; --muted:#b3a8cf; --primary:#a58af0; --soft:#2c2350; --border:#342b57; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
         background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }
  main { max-width:380px; width:100%; text-align:center; }
  .icon { width:84px; height:84px; margin:0 auto 18px; border-radius:26px; background:var(--soft); display:flex; align-items:center; justify-content:center; color:var(--primary); }
  h1 { margin:0 0 8px; font-size:24px; }
  p { margin:0 0 22px; color:var(--muted); line-height:1.6; font-size:15px; }
  button { width:100%; min-height:48px; border:0; border-radius:999px; background:var(--primary); color:#fff; font:inherit; font-weight:700; font-size:16px; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button { color:#17122b; } }
  .note { margin-top:14px; font-size:13px; }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><path d="M12 20h.01"/><path d="M3 3l18 18"/>
    </svg>
  </div>
  <h1>אין חיבור לאינטרנט</h1>
  <p>הרעיונות, התוכניות והזיכרונות שלכם שמורים בענן — ברגע שהחיבור יחזור, הכול כאן בדיוק כמו שהשארתם.</p>
  <button type="button" onclick="location.reload()">לנסות שוב</button>
  <p class="note">הדף יתרענן לבד כשהחיבור יחזור.</p>
</main>
<script>
  window.addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
